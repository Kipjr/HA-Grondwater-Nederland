---
name: Lint Code Base

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: ["master","dev"]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    name: Lint
    permissions:
      # Required to checkout and push automatic lint fixes.
      contents: write
      packages: read
      # Required for Super-Linter pull request summary comments.
      issues: write
      pull-requests: write
      # Required to report GitHub Actions status checks.
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Super-linter needs the full git history to get the
          # list of files that changed across commits.
          fetch-depth: 0
          persist-credentials: true

      - name: Super-linter
        uses: super-linter/super-linter@v9.0.0 # x-release-please-version
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: "master"
          VALIDATE_JSON: true
          FIX_JSON: true
          VALIDATE_YAML_PRETTIER: true
          FIX_YAML_PRETTIER: true
          VALIDATE_JSON_PRETTIER: true
          FIX_JSON_PRETTIER: true
          VALIDATE_YAML: true
          VALIDATE_PYTHON: true
          VALIDATE_PYTHON_PYLINT: true
          PYTHON_PYLINT_CONFIG_FILE: .pylintrc
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push linting fixes
        if: >
          (github.event_name == 'pull_request' || github.event_name == 'push') &&
          github.ref_name != github.event.repository.default_branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
          commit_message: "chore: fix linting issues"
          commit_user_name: super-linter
          commit_user_email: super-linter@super-linter.dev

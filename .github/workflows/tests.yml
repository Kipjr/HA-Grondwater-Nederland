name: Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-homeassistant-custom-component
      - run: pytest -q

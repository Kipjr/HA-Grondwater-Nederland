name: Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r tests/requirements_test.txt
      - name: Run tests
        run: pytest -q
        env:
          PYTHONPATH: custom_components
